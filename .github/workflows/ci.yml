name: Tests and Docker Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t hsrshelllightcone-api .